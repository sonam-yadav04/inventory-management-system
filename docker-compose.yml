version: "3.8"

services:
  mysql:
    image: mysql:8
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  login_service:
    build:
      context: .
      dockerfile: backend/login_service/Dockerfile
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  product_management_service:
    build:
      context: .
      dockerfile: backend/product_management_service/Dockerfile
    env_file: .env
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy

  stock_management_service:
    build:
      context: .
      dockerfile: backend/stock_management_service/Dockerfile
    env_file: .env
    ports:
      - "5003:5003"
    depends_on:
      mysql:
        condition: service_healthy

  order_management_service:
    build:
      context: .
      dockerfile: backend/order_management_service/Dockerfile
    env_file: .env
    ports:
      - "5004:5004"
    depends_on:
      mysql:
        condition: service_healthy

  # events_management_service and api_gateway: add after their Dockerfile / nginx.conf are written

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"

volumes:
  mysql_data:
